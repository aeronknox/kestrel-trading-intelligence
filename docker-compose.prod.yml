# Production-style deployment behind Caddy (automatic HTTPS). Layer it over the base file:
#
#   DOMAIN=trading.example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires Docker Compose 2.24.4+ (for `!reset`). Only Caddy publishes ports (80/443); the
# API, web server, database and Redis are reachable only on the internal Docker network.
# DOMAIN=localhost works for a local trial with a self-signed certificate.

x-proxy-secret: &proxy-secret ${PROXY_SHARED_SECRET:?Set PROXY_SHARED_SECRET in .env (e.g. openssl rand -hex 32)}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname, or localhost}
      PROXY_SHARED_SECRET: *proxy-secret
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  backend:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      CORS_ORIGINS: https://${DOMAIN}
      PUBLIC_APP_URL: https://${DOMAIN}
      # Trust forwarded client IPs only from hops that present the shared secret.
      TRUSTED_PROXIES: ""
      PROXY_SHARED_SECRET: *proxy-secret

  frontend:
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN}/api/v1/ws/market
    environment:
      TRUST_PROXY_HEADERS: "true"
      PROXY_SHARED_SECRET: *proxy-secret

  worker:  # only started with --profile worker
    environment:
      ENVIRONMENT: production
      PUBLIC_APP_URL: https://${DOMAIN}

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
