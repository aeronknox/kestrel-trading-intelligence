name: trading-intelligence

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@postgres:5432/${POSTGRES_DB:-trading}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_JSON: ${LOG_JSON:-true}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Optional dedicated job runner: `docker compose --profile worker up`. A Redis lease elects one
  # job runner, so it is safe next to the API; set RUN_BACKGROUND_JOBS=false on the backend to keep
  # jobs off the request path.
  worker:
    build: ./backend
    profiles: ["worker"]
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@postgres:5432/${POSTGRES_DB:-trading}
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: ${LOG_JSON:-true}
    healthcheck:
      disable: true  # no HTTP server; the backend's healthcheck does not apply
    depends_on:
      backend:
        condition: service_healthy  # migrations have run

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/ws/market}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
