name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, SQLite + PostgreSQL)
    runs-on: ubuntu-24.04  # pinned: Playwright browser dependencies support it
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trading -d trading"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PG_URL: postgresql+psycopg://trading:trading@localhost:5432/trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy
      - name: Dependency audit (known vulnerabilities in pinned packages)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Migrations on PostgreSQL (upgrade, drift check, downgrade, upgrade)
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Tests on SQLite
        run: pytest -q

      - name: Tests on PostgreSQL (and the Redis job lease)
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
          TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-24.04  # pinned: Playwright browser dependencies support it
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # What ships to browsers and the Next.js server; dev tooling is reviewed through Dependabot.
      - name: Dependency audit (production packages)
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose stack + browser flows
    runs-on: ubuntu-24.04  # pinned: Playwright browser dependencies support it
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          # Synthetic data keeps the browser flows deterministic; the backend job covers real-provider parsing.
          sed -i "s|^MARKET_DATA_PROVIDER=.*|MARKET_DATA_PROVIDER=sample|" .env
          # All browser traffic reaches the API through the Next.js proxy, i.e. from a single IP.
          sed -i "s|^AUTH_RATE_LIMIT_PER_MINUTE=.*|AUTH_RATE_LIMIT_PER_MINUTE=100|" .env
          # Exercise the public demo sandbox in the browser flows.
          sed -i "s|^DEMO_MODE=.*|DEMO_MODE=true|" .env
          # The load test sends everything from one address.
          sed -i "s|^RATE_LIMIT_PER_MINUTE=.*|RATE_LIMIT_PER_MINUTE=100000|" .env
          sed -i "s|^COMPUTE_RATE_LIMIT_PER_MINUTE=.*|COMPUTE_RATE_LIMIT_PER_MINUTE=100000|" .env
      - name: Build and start (with the dedicated worker and Prometheus)
        run: .github/scripts/report-failure.sh "Build and start" docker compose --profile worker --profile monitoring up --build --detach --wait --wait-timeout 300
      - name: Health
        run: |
          curl -fsS http://localhost:8000/health/ready | tee /dev/stderr | grep -q '"database":"ok"'
          curl -fsS -o /dev/null http://localhost:3000/login
          # The worker is running and one of the two job runners holds the Redis lease.
          docker compose --profile worker --profile monitoring ps worker --format '{{.State}}' | grep -q running
          for i in $(seq 1 20); do docker compose --profile worker --profile monitoring logs worker | grep -q worker_started && break; sleep 2; done
          docker compose --profile worker --profile monitoring logs worker | grep -q worker_started
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser
        working-directory: frontend
        timeout-minutes: 15
        run: |
          r=../.github/scripts/report-failure.sh
          $r "npm ci" npm ci
          $r "Install browser" npx playwright install chromium
          # The runner image ships Chrome's system libraries; use apt only if the browser can't start without them.
          if ! node -e "require('playwright').chromium.launch().then((b) => b.close())"; then
            $r "Install browser system dependencies" npx playwright install-deps chromium
          fi
      - name: Browser flows
        working-directory: frontend
        run: npm run e2e
      - name: Accessibility (axe, both themes) and phone-width layout
        working-directory: frontend
        run: npm run a11y
      - name: Metrics and alert rules
        run: |
          # The API's own metrics, including the paper orders the browser flows just placed.
          curl -fsS http://localhost:8000/metrics > metrics.txt
          grep -q '^kestrel_http_requests_total{.*route="/api/v1/paper/orders"' metrics.txt
          grep -q '^kestrel_paper_orders_total{.*source="user"' metrics.txt
          # Prometheus loaded the rules and scrapes both the API and the worker.
          curl -fsS http://localhost:9090/api/v1/rules | jq -e '[.data.groups[].rules[]] | length >= 8'
          for i in $(seq 1 30); do
            up=$(curl -fsS http://localhost:9090/api/v1/targets | jq '[.data.activeTargets[] | select(.health == "up")] | length')
            [ "$up" = "2" ] && break; sleep 2
          done
          curl -fsS http://localhost:9090/api/v1/targets | jq -e '[.data.activeTargets[] | select(.health == "up")] | length == 2'
          # Exactly one process (API or worker) holds the background-jobs lease.
          curl -fsS --get http://localhost:9090/api/v1/query --data-urlencode 'query=sum(kestrel_background_jobs_leader)' | tee /dev/stderr | jq -e '.data.result[0].value[1] == "1"'
      - name: Load test (20 concurrent visitors on PostgreSQL)
        run: |
          # Runs inside the Compose network with the backend image (it has httpx); fails on any error or a slow p95.
          docker compose --profile worker --profile monitoring run --rm --no-deps --entrypoint python \
            -v "$PWD/backend/scripts:/scripts:ro" -e GITHUB_ACTIONS backend \
            /scripts/loadtest.py --url http://backend:8000 --users 20 --duration 45 --ramp 5 --seed 7 \
            --max-error-rate 0 --max-p95-ms 1500
      - name: Backup and restore (the docs/OPERATIONS.md procedure)
        run: |
          dc() { docker compose --profile worker --profile monitoring "$@"; }
          users() { dc exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from users"'; }
          before=$(users); echo "users before: $before"; [ "$before" -gt 0 ]
          mkdir -p backups
          dc exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom' > backups/ci.dump
          dc stop backend worker frontend
          dc exec -T postgres sh -c 'dropdb -U "$POSTGRES_USER" --force "$POSTGRES_DB" && createdb -U "$POSTGRES_USER" "$POSTGRES_DB"'
          [ "$(users 2>/dev/null || echo gone)" = "gone" ]  # really empty
          dc exec -T postgres sh -c 'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner' < backups/ci.dump
          dc up -d --wait --wait-timeout 180
          after=$(users); echo "users after: $after"; [ "$after" = "$before" ]
          curl -fsS http://localhost:8000/health/ready | grep -q '"database":"ok"'
      - name: Logs on failure
        if: failure()
        run: |
          docker compose --profile worker --profile monitoring logs --no-color --tail 200
          # Server-side errors as annotations (readable on the run page without signing in).
          docker compose --profile worker --profile monitoring logs --no-color backend worker 2>/dev/null \
            | grep -E '"level": ?"(error|warning)"|\[(error|warning) *\]|Traceback|Error:' | grep -v 'redis_unavailable' \
            | tail -n 15 | cut -c1-600 | sed 's/^/::error title=Server log::/' || true
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: frontend/e2e/fail_*.png
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: docker compose --profile worker --profile monitoring down --volumes

  https:
    name: HTTPS deployment (Caddy) + browser flows
    runs-on: ubuntu-24.04  # pinned: Playwright browser dependencies support it
    needs: [backend, frontend]
    env:
      DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^PROXY_SHARED_SECRET=.*|PROXY_SHARED_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^MARKET_DATA_PROVIDER=.*|MARKET_DATA_PROVIDER=sample|" .env
          sed -i "s|^AUTH_RATE_LIMIT_PER_MINUTE=.*|AUTH_RATE_LIMIT_PER_MINUTE=100|" .env
      - name: Build and start (production override)
        run: .github/scripts/report-failure.sh "Build and start" docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build --detach --wait --wait-timeout 300
      - name: HTTPS, redirect and exposure checks
        run: |
          # The local CA's certificate is self-signed, hence -k.
          curl -kfsS -o /dev/null https://localhost/login
          curl -sS -o /dev/null -w "%{http_code} %{redirect_url}" http://localhost/login | tee /dev/stderr | grep -q "^308 https://localhost/login"
          curl -ksI https://localhost/login | grep -qi "^strict-transport-security"
          # Only Caddy is published: the API, web server, database and Redis are internal.
          for port in 8000 3000 5432 6379; do
            if curl -s --max-time 3 -o /dev/null "http://localhost:$port"; then echo "port $port is exposed"; exit 1; fi
          done
          # Secure session cookie over HTTPS.
          curl -ksS -D - -o /dev/null -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"ci-passw0rd-1234","full_name":"CI"}' \
            https://localhost/api/v1/auth/register | grep -i "^set-cookie" | grep -qi "secure"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser
        working-directory: frontend
        timeout-minutes: 15
        run: |
          r=../.github/scripts/report-failure.sh
          $r "npm ci" npm ci
          $r "Install browser" npx playwright install chromium
          # The runner image ships Chrome's system libraries; use apt only if the browser can't start without them.
          if ! node -e "require('playwright').chromium.launch().then((b) => b.close())"; then
            $r "Install browser system dependencies" npx playwright install-deps chromium
          fi
      - name: Browser flows over HTTPS
        working-directory: frontend
        env:
          BASE: https://localhost
          IGNORE_HTTPS_ERRORS: "1"
        run: npm run e2e
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail 200
          # Server-side errors as annotations (readable on the run page without signing in).
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color backend 2>/dev/null \
            | grep -E '"level": ?"(error|warning)"|\[(error|warning) *\]|Traceback|Error:' | grep -v 'redis_unavailable' \
            | tail -n 15 | cut -c1-600 | sed 's/^/::error title=Server log::/' || true
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: https-e2e-failure-screenshots
          path: frontend/e2e/fail_*.png
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down --volumes
