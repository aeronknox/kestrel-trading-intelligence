# Weekly dependency update pull requests; CI (tests, browser flows, audits) runs on each.
# Minor and patch updates are grouped per ecosystem to keep the number of PRs small.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native-compiler rewrite; adopt it deliberately once the Next.js
      # and typescript-eslint toolchain supports it (its update PR failed typecheck).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    ignore:
      # Python minor versions move together across the image, CI (setup-python) and local
      # venvs, once the scientific wheels (numpy, pandas, scikit-learn) are published for it.
      - dependency-name: python
        update-types: [version-update:semver-minor]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
